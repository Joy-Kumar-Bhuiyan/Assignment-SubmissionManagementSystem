name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            BackendApi/BackendApi.csproj
            BackendApi.Tests/BackendApi.Tests.csproj
      - run: dotnet restore BackendApi.Tests/BackendApi.Tests.csproj
      - run: dotnet test BackendApi.Tests/BackendApi.Tests.csproj --no-restore --configuration Release
      - run: dotnet list BackendApi/BackendApi.csproj package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontendWeb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FrontendWeb/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
